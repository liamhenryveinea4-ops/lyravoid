<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Access Terminal</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      background-color: #0b0c10;
      color: #66fcf1;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .terminal {
      background: #1f2833;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(102, 252, 241, 0.2);
      text-align: center;
      max-width: 450px;
      width: 90%;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }
    p {
      color: #c5c6c7;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 80%;
      padding: 12px;
      background: #0b0c10;
      border: 1px solid #45a29e;
      color: #66fcf1;
      font-family: inherit;
      font-size: 1.1rem;
      text-align: center;
      outline: none;
      border-radius: 4px;
    }
    input[type="text"]:focus {
      border-color: #66fcf1;
      box-shadow: 0 0 10px rgba(102, 252, 241, 0.4);
    }
    button {
      margin-top: 15px;
      padding: 10px 25px;
      background: #45a29e;
      border: none;
      color: #0b0c10;
      font-weight: bold;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.3s;
    }
    button:hover {
      background: #66fcf1;
    }
    #error-msg {
      color: #ff4d4d;
      font-size: 0.9rem;
      margin-top: 15px;
      display: none;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="terminal">
    <h1>[ SYSTEM ACCESS ]</h1>
    <p>Autorisierung erforderlich. Bitte Code eingeben:</p>
    <form onsubmit="handleAuth(event)">
      <input type="text" id="passcode" placeholder="Passwort..." autocomplete="off" required>
      <br>
      <button type="submit">Eingabe</button>
    </form>
    <div id="error-msg">⚠️ Falsches Passwort!</div>
  </div>

  <script>
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function handleAuth(e) {
      e.preventDefault();
      const input = document.getElementById('passcode').value.trim().toLowerCase();
      const errorMsg = document.getElementById('error-msg');
      const hash = await sha256(input);

      
      if (hash === '3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b') {
        window.location.href = input + '.html';
     
      } else if (hash === 'e48a3aa6c3d1000673010b9fb7dbe7cf8264580fb2228556db743e498c1b3ee6') {
      
        const target = ['happy', 'secret', 'birthday'].join('-') + '.html';
        window.location.href = target;
      } else {
        errorMsg.style.display = 'block';
        document.getElementById('passcode').value = '';
        document.getElementById('passcode').focus();
      }
    }
  </script>

</body>
</html>
