<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      background: radial-gradient(circle at center, #1a1a2e 0%, #0d0d15 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .gift-box {
      background: rgba(26, 26, 46, 0.95);
      border: 2px solid #66fcf1;
      border-radius: 20px;
      padding: 45px 35px;
      box-shadow: 0 0 40px rgba(102, 252, 241, 0.35);
      max-width: 520px;
      width: 90%;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(102, 252, 241, 0.15);
      border: 1px solid #66fcf1;
      border-radius: 20px;
      color: #66fcf1;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }
    h1 {
      font-size: 2.1rem;
      margin: 10px 0 15px;
      background: linear-gradient(45deg, #66fcf1, #ff77c6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #c5c6c7;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }
    .code-wrapper {
      background: #0b0c10;
      border: 2px dashed #ff77c6;
      border-radius: 12px;
      padding: 20px;
      margin: 25px 0;
      user-select: all;
    }
    .key-label {
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .key-display {
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.15rem;       /* Vorher 1.45rem -> etwas verkleinert */
      font-weight: bold;
      letter-spacing: 1.5px;    /* Vorher 3px -> spart Platz in der Breite */
      color: #ffe600;
      white-space: nowrap;      /* Verhindert garantiert jeden automatischen Zeilenumbruch */
    }
    .note {
      font-size: 0.85rem;
      color: #888;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="gift-box">
    <div class="badge">Decryption Successful</div>
    <h1>Happy Birthday!</h1>
    <p>Du hast das System vollständig entschlüsselt und alle Spuren zusammengefügt. Hier ist deine Belohnung:</p>

    <div class="code-wrapper">
      <div class="key-label">Produkt-Key</div>
      <div class="key-display">FQJ9J-Y4VP3-H7HCW-QYGFD-2KTCZ</div>
    </div>

    <div class="note">
      Kopiere den Code und löse ihn in im Store ein. Viel Spaß!
    </div>
  </div>

</body>
</html>
