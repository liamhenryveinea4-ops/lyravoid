<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>★ B-Komachi Secret Stage ★</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      background: radial-gradient(circle at center, #2e082c 0%, #0d0112 100%);
      color: #ff77c6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .idol-card {
      background: rgba(30, 8, 38, 0.9);
      border: 2px solid #ff2a85;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 0 35px rgba(255, 42, 133, 0.45), inset 0 0 15px rgba(255, 119, 198, 0.25);
      max-width: 520px;
      width: 90%;
      text-align: center;
      position: relative;
    }
    .star-eye {
      font-size: 2.2rem;
      color: #ffe600;
      text-shadow: 0 0 14px #ff2a85;
      margin-bottom: 5px;
    }
    h1 {
      color: #ffffff;
      font-size: 1.7rem;
      margin: 10px 0;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px #ff77c6;
    }
    .quote {
      font-style: italic;
      color: #ffb3df;
      font-size: 0.95rem;
      margin-bottom: 30px;
    }
    .items-box {
      background: rgba(13, 1, 18, 0.85);
      border: 1px dashed #ff2a85;
      border-radius: 12px;
      padding: 25px 30px;
      text-align: left;
      margin: 0 auto 30px;
    }
    .items-box ol {
      margin: 0;
      padding-left: 20px;
      color: #ffffff;
      font-size: 1.15rem;
      line-height: 2.2;
      font-weight: 500;
    }
    .back-btn {
      display: inline-block;
      text-decoration: none;
      color: #ffffff;
      background: linear-gradient(45deg, #ff2a85, #8a2be2);
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: bold;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(255, 42, 133, 0.4);
      transition: transform 0.2s, opacity 0.2s;
    }
    .back-btn:hover {
      opacity: 0.9;
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <div class="idol-card">
    <div class="star-eye">★ ❤ ★</div>
    <h1>Ai's Stage</h1>
    <div class="quote">„Lügen sind eine außergewöhnliche Form der Liebe... aber diese Fragmente hier sind echt.“</div>

    <div class="items-box">
      <ol>
        <li>4 Strikes und die Dunkelheit kommt</li>
        <li>Wo ein Bett nicht hilft...</li>
        <li>Der Stab am Ende der Reise</li>
        <li>Substanz des neuen Schleim</li>
      </ol>
    </div>

    <a href="terminal.html" class="back-btn">← Zurück zum Terminal</a>
  </div>

</body>
</html>
